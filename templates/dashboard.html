<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Trading Desk - 完美系K線</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #121214;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #00e676;
            margin-bottom: 30px;
        }
        .chart-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }
        @media(min-width: 768px) {
            .chart-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        .chart-container {
            background-color: #1e1e24;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: #cfd8dc;
        }
        .note {
            text-align: center;
            color: #90a4ae;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Smart Trading Desk 智能 K 線儀表板</h1>
        <div class="note">系統採用國際標準台股配色：收盤價低於開盤價必為綠色，收盤價高於開盤價必為紅色</div>
        <div class="chart-grid" id="dashboard-grid"></div>
    </div>

    <script>
        const stockConfig = [
            { id: '2330' },
            { id: '2308' },
            { id: '0050' },
            { id: '00981A' },
            { id: '00403A' },
            { id: '006208' }
        ];

        function initDashboard() {
            const grid = document.getElementById('dashboard-grid');
            grid.innerHTML = ''; 
            stockConfig.forEach(stock => {
                const html = `
                    <div class="chart-container">
                        <h2 id="title-${stock.id}">代號 (${stock.id}) 走勢載入中...</h2>
                        <canvas id="chart-${stock.id}"></canvas>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', html);
            });
            stockConfig.forEach(stock => {
                loadStockData(stock.id, `chart-${stock.id}`, `title-${stock.id}`);
            });
        }

        function getCandleColor(d) {
            return d.c >= d.o ? '#ff5252' : '#00e676';
        }

        const candlestickLinesPlugin = {
            id: 'candlestickLines',
            beforeDatasetsDraw(chart) {
                const { ctx, scales: { x, y } } = chart;
                const ohlcRawData = chart.options.plugins.candlestickLines.ohlcData;
                chart.getDatasetMeta(0).data.forEach((bar, index) => {
                    const raw = ohlcRawData[index];
                    if (!raw) return;
                    const xPos = bar.x;
                    ctx.strokeStyle = getCandleColor(raw);
                    ctx.lineWidth = 2; ctx.beginPath();
                    ctx.moveTo(xPos, y.getPixelForValue(raw.h));
                    ctx.lineTo(xPos, y.getPixelForValue(raw.l)); ctx.stroke();
                });
            }
        };

        function createCandlestickChart(canvasId, label, stockId, ohlcData) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            const barData = ohlcData.map(d => [Math.min(d.o, d.c), Math.max(d.o, d.c)]);
            const timelineColors = ohlcData.map(d => getCandleColor(d));
            const maxPrice = Math.max(...ohlcData.map(d => d.h));
            const minPrice = Math.min(...ohlcData.map(d => d.l));
            const padding = (maxPrice - minPrice) || (maxPrice * 0.05); 

            return new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ohlcData.map(d => d.t),
                    datasets: [{
                        label: label,
                        data: barData,
                        backgroundColor: timelineColors,
                        borderColor: timelineColors,
                        borderWidth: 1, barThickness: 15
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: { grid: { color: '#2e2e38' }, ticks: { color: '#90a4ae' } },
                        y: { min: minPrice - padding, max: maxPrice + padding, grid: { color: '#2e2e38' }, ticks: { color: '#90a4ae' } }
                    },
                    plugins: {
                        legend: { labels: { color: '#ffffff' } },
                        candlestickLines: { ohlcData: ohlcData, stockId: stockId },
                        tooltip: {
                            callbacks: {
                                label: context => {
                                    const raw = ohlcData[context.dataIndex];
                                    return [`開盤價格: ${raw.o}`, `最高價格: ${raw.h}`, `最低價格: ${raw.l}`, `收盤價格: ${raw.c}`];
                                }
                            }
                        }
                    }
                },
                plugins: [candlestickLinesPlugin]
            });
        }

        function loadStockData(stockId, canvasId, titleId) {
            fetch(`/api/stock/${stockId}`)
                .then(response => response.json()).then(data => {
                    if (data.status === 'success' && data.data.length > 0) {
                        document.getElementById(titleId).innerText = `${data.stock_name} (${data.stock_id}) 歷史K線`;
                        createCandlestickChart(canvasId, data.stock_name, stockId, data.data);
                    } else {
                        document.getElementById(titleId).innerText = `代號 (${stockId}) 暫無K線資料`;
                    }
                }).catch(err => { document.getElementById(titleId).innerText = '資料載入失敗'; });
        }
        window.onload = initDashboard;
    </script>
</body>
</html>
